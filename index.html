<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MECOS PAY</title>
  <link rel="icon" href="https://www.intern-mecos.com/favicon.ico">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* MECOS PAY の入口（画面いっぱい）。ここで「Google でログイン」をして、受け取った本人証明（IDトークン）を本体に POST し、
       本体が返す画面（通行証つき）を全面に埋め込む。本体は Google ログインなしでも開ける設定なので、Safari・iPhone でも 401 にならない。
       ここにはデータも鍵も置かない（OAuth クライアントIDは公開してよい値）。 */
    html, body { margin: 0; height: 100%; background: #F5F7FA; font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, sans-serif; color: #20242B; }
    #signin { min-height: 100%; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #E3E7EE; border-radius: 12px; padding: 32px 28px; max-width: 360px; width: calc(100% - 32px); box-sizing: border-box; text-align: center; line-height: 1.8; }
    .card h1 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 0 0 16px; font-size: 14px; color: #5B6270; }
    #gbutton { display: flex; justify-content: center; min-height: 44px; }
    #message { margin-top: 12px; font-size: 13px; color: #B3261E; }
    iframe { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F5F7FA; }
    body.app #signin { display: none; }
    body.app iframe { display: block; }
  </style>
</head>
<body>
  <div id="signin">
    <div class="card">
      <h1>MECOS PAY</h1>
      <p>登録した Google アカウントでログインしてください。</p>
      <div id="gbutton"></div>
      <div id="message" role="alert"></div>
    </div>
  </div>
  <iframe name="app" id="app" title="MECOS PAY" allow="clipboard-write"></iframe>
  <form id="loginForm" method="post" target="app" hidden><input type="hidden" name="credential" id="credential"></form>
  <script>
    (function() {
      var CONFIG = {
        // 本番の本体（Google ログインなしでも開ける設定で公開しているもの）と、Google ログインの OAuth クライアントID
        app: 'https://script.google.com/macros/s/AKfycbwu-LSQspmexNhGXgtBmCvX4G_WdOfxoPFSgpzG72zMWmtTYCjZ99Bjaivke5tk9WMhRQ/exec',
        clientId: '308894795051-snk366gaf8p1d0i3tb4j9orh8s8q97et.apps.googleusercontent.com'
      };
      var form = document.getElementById('loginForm'), message = document.getElementById('message');
      form.action = CONFIG.app;
      function signedIn(response) {
        if (!response || !response.credential) { message.textContent = 'ログインできませんでした。もう一度お試しください。'; return; }
        document.getElementById('credential').value = response.credential;
        document.body.className = 'app';
        form.submit(); // 本人証明を本体へ送り、返ってきた画面を全面に出す（本人証明は URL に載せない）
        document.getElementById('credential').value = '';
      }
      function start() {
        if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(start, 200); return; }
        google.accounts.id.initialize({client_id: CONFIG.clientId, callback: signedIn, auto_select: true, itp_support: true, use_fedcm_for_prompt: true});
        google.accounts.id.renderButton(document.getElementById('gbutton'), {theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja'});
        google.accounts.id.prompt(); // 前回ログインした人は、自動でログインする
      }
      // 本体から「ログインし直してほしい」（通行証の期限切れなど）と言われたら、ログイン画面に戻す
      window.addEventListener('message', function(event) {
        if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(event.origin)) return;
        if (!event.data || event.data.type !== 'mecos-login-required') return;
        document.body.className = '';
        // 自動ログインはしない（許可リストにない人などで、ログイン→断られる→ログインを繰り返さないように）。ボタンを押してもらう。
        message.textContent = 'ログインの有効期限が切れたか、ログインできませんでした。もう一度ログインしてください。';
        if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      });
      start();
    })();
  </script>
</body>
</html>
