<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MECOS PAY（検証）</title>
  <link rel="icon" href="https://www.intern-mecos.com/favicon.ico">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* MECOS PAY の入口。ここで「Google でログイン」をして、受け取った本人証明（IDトークン）を本体に直接（fetch で）送る。
       本体は確かめたうえで、通行証を埋め込んだ画面の HTML を返すので、このページにそのまま表示する（埋め込みは使わない）。
       画面からの呼び出しも本体へ直接（fetch で）送る。Google の Cookie を使わないので、iPhone の Safari でも 401 にならない。
       ここにはデータも鍵も置かない（OAuth クライアントIDは公開してよい値）。 */
    html, body { margin: 0; height: 100%; background: #F5F7FA; font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, sans-serif; color: #20242B; }
    #signin { min-height: 100%; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #E3E7EE; border-radius: 12px; padding: 32px 28px; max-width: 360px; width: calc(100% - 32px); box-sizing: border-box; text-align: center; line-height: 1.8; }
    .card h1 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 0 0 16px; font-size: 14px; color: #5B6270; }
    #gbutton { display: flex; justify-content: center; min-height: 44px; }
    #message { margin-top: 12px; font-size: 13px; color: #B3261E; }
    #message.info { color: #5B6270; }
  </style>
</head>
<body>
  <div id="signin">
    <div class="card">
      <h1>MECOS PAY（検証）</h1>
      <p>登録した Google アカウントでログインしてください。</p>
      <div id="gbutton"></div>
      <div id="message" role="alert"></div>
    </div>
  </div>
  <script>
    (function() {
      var CONFIG = {
        // 検証の本体（Google ログインなしでも開ける設定で公開しているもの）と、Google ログインの OAuth クライアントID
        app: 'https://script.google.com/macros/s/AKfycbxc2UjLLoPB6ZICOSeAJWvidQDTKd1m-1-DVuwQenlev5u_zc0X-tq5jPK_LulvB7W5/exec',
        clientId: '308894795051-snk366gaf8p1d0i3tb4j9orh8s8q97et.apps.googleusercontent.com'
      };
      var message = document.getElementById('message'), busy = false;
      function show(text, info) { message.textContent = text; message.className = info ? 'info' : ''; }
      function signedIn(response) {
        if (busy) return;
        if (!response || !response.credential) { show('ログインできませんでした。もう一度お試しください。'); return; }
        busy = true;
        show('MECOS PAY を開いています…', true);
        fetch(CONFIG.app, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({kind: 'login', credential: response.credential, api: CONFIG.app})})
          .then(function(r) { if (!r.ok) throw new Error('サーバーに接続できませんでした（' + r.status + '）。'); return r.json(); })
          .then(function(res) {
            if (!res || !res.ok) {
              busy = false;
              // 断られたときは自動ログインを止める（ログイン→断られる→ログイン を繰り返さないように）
              if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
              show((res && res.error) || 'ログインできませんでした。');
              return;
            }
            // 本体から受け取った画面（通行証つき）に、このページをまるごと置き換える
            document.open(); document.write(res.html); document.close();
          })
          .catch(function(error) { busy = false; show((error && error.message ? error.message : '接続できませんでした。') + ' 少し待ってもう一度お試しください。'); });
      }
      function start() {
        if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(start, 200); return; }
        google.accounts.id.initialize({client_id: CONFIG.clientId, callback: signedIn, auto_select: true, itp_support: true, use_fedcm_for_prompt: true});
        google.accounts.id.renderButton(document.getElementById('gbutton'), {theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja'});
        google.accounts.id.prompt(); // 前回ログインした人は、自動でログインする
      }
      start();
    })();
  </script>
</body>
</html>
